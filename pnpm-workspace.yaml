# Single-package repo. pnpm reads its install settings from here so they do not
# leak into npm's config parser (which warns on unknown keys).
# Hoist peer deps so React resolves from the package root during dev.
autoInstallPeers: true
strictPeerDependencies: false

# Declare which dependency build scripts are allowed to run — pnpm refuses to
# install otherwise.
allowBuilds:
  esbuild: true
